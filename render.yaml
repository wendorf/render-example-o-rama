envVarGroups:
- name: duplicate
  envVars:
  - key: FIRST_KEY
    value: first-value
- name: duplicate
  envVars:
  - key: SECOND_KEY
    value: second-value
- name: duplicate
  envVars:
  - key: THIRD_KEY
    value: third-value
services:
- type: web
  name: needs-envgroup
  runtime: node
  repo: https://github.com/render-examples/express-hello-world
  buildCommand: yarn --frozen-lockfile install --whatever
  startCommand: node app.js --whatever
  envVars:
  - fromGroup: duplicate
