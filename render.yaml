envVarGroups:
- name: evg-remove-envVars
  envVars:
  - key: STABLE_KEY
    value: stable-value
- name: evg-add-envVars
  envVars:
  - key: STABLE_KEY
    value: stable-value
  - key: REMOVABLE_KEY
    value: removable-value
  - key: ADDED_KEY
    value: removable-value
projects:
- name: foo
  environments:
  - name: bar
    envVarGroups:
    - name: evg-nochange-envVars
      envVars:
      - key: STABLE_KEY
        value: stable-value
      - key: REMOVABLE_KEY
        value: removable-value
