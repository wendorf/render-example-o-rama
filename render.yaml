ungrouped:
  envVarGroups:
  - name: "testTest"
    envVars:
    - key: "TEST_VAR"
      value: "test"

projects:
- name: "Dumbleton"
  environments:
  - name: "Production"
    networking:
      isolation: "enabled"
    services:
    - type: web
      runtime: "node"
      name: "test-test"
      repo: "https://github.com/bdumbleton/dumbleton.git"
      plan: "free"
      buildCommand: "npm install"
      startCommand: "npm run start"
      region: "ohio"
  - name: "Staging"
