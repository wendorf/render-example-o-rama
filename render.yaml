ungrouped:
  services:
  - type: web
    name: svc-linked
    runtime: node
    repo: https://github.com/render-examples/express-hello-world
    buildCommand: yarn --frozen-lockfile install
    startCommand: node app.js
    envVars:
    - fromGroup: evg-linked
  envVarGroups:
  - name: evg-linked
    envVars:
    - key: LINKED_KEY
      value: linked-value
