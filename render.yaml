projects:
- name: second-project
  environments:
  - name: second-third-environment
    isolated: true
    protectedStatus: protected
    services:
    # A Docker web service
    - type: web
      name: express
      runtime: node
      repo: https://github.com/render-examples/express-hello-world
      buildCommand: yarn --frozen-lockfile install
      startCommand: node app.js
    - type: cron
      name: cronny
      runtime: node
      repo: https://github.com/render-examples/express-hello-world
      buildCommand: yarn --frozen-lockfile install
      startCommand: node app.js
      schedule: '0 0 1 1 *'
    - type: keyvalue
      name: thunder
      ipAllowList: []
    databases:
    - name: elephant
    envVarGroups:
    - name: my-env-group
      envVars:
      - key: CONCURRENCY
        value: 2
      - key: SHARED_SECRET
        generateValue: true
    - name: used-group
      envVars:
      - key: USED_KEY
        value: used-value
  - name: second-fourth-environment
    services:
    - type: web
      name: needs-envgroup
      runtime: node
      repo: https://github.com/render-examples/express-hello-world
      buildCommand: yarn --frozen-lockfile install
      startCommand: node app.js
      envVars:
      - fromGroup: used-group
