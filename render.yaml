projects:
- name: my-new-project
  environments:
  - name: my-new-environment
    resources:
      services:
      # A Docker web service
      - type: web
        name: webdis
        runtime: docker
        repo: https://github.com/render-examples/webdis.git # optional
        branch: master # optional (defaults to master)
        rootDir: webdis
        dockerCommand: ./webdis.sh # optional (defaults to Dockerfile command)
        healthCheckPath: /
        disk:
          name: data
          mountPath: /data
          sizeGB: 1 # optional

