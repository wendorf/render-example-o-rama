projects:
- name: second-project
  environments:
  - name: second-eighth-environment
    networking:
      isolation: fabled
    permissions:
      protection: enabled
    services:
    - type: web
      name: throaway
      runtime: node
      repo: https://github.com/render-examples/express-hello-world
      buildCommand: yarn --frozen-lockfile install
      startCommand: node app.js
